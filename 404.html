<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 | Nexus infOT</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06050C">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23120C1B'/%3E%3Cg fill='none' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath stroke='%23FF3D8B' d='M5 10C14 10 18 22 27 22'/%3E%3Cpath stroke='%238C7BFF' d='M5 22C14 22 18 10 27 10'/%3E%3Cpath stroke='%23FFC23D' d='M5 16H27'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#06050C; --ink:#EEF2FF; --muted:#9CA3C4; --hud:#3BE8FF; --t1:#FF3D8B; --t3:#8C7BFF; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{display:grid; place-items:center; padding:24px; background:radial-gradient(900px 520px at 70% -10%, rgba(140,123,255,.18), transparent 70%), var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; text-align:center}
body::before{content:""; position:fixed; inset:0; background-image:linear-gradient(rgba(59,232,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(59,232,255,.06) 1px,transparent 1px); background-size:56px 56px; pointer-events:none}
main{position:relative; max-width:560px}
.tag{font:700 12px/1 ui-monospace,Menlo,monospace; letter-spacing:.28em; color:var(--hud)}
h1{margin:18px 0 8px; font-size:clamp(4.5rem,18vw,8rem); line-height:1; letter-spacing:-.04em; animation:glitch 3.2s steps(1) infinite}
@keyframes glitch{0%,92%,100%{text-shadow:none; transform:none} 93%{text-shadow:4px 0 var(--hud),-4px 0 var(--t1); transform:translateX(-4px)} 95%{text-shadow:-3px 0 var(--hud),3px 0 var(--t1); transform:translateX(3px)}}
p{margin:0 auto 28px; color:var(--muted)}
a{display:inline-block; padding:15px 26px; color:#14040D; background:linear-gradient(100deg,var(--t1),var(--t3)); font:700 14px/1 ui-monospace,Menlo,monospace; letter-spacing:.14em; text-transform:uppercase; text-decoration:none; clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
a:focus-visible{outline:2px solid var(--hud); outline-offset:4px}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
</style>
</head>
<body>
<main>
  <p class="tag">ERROR 404 // SIGNAL LOST</p>
  <h1>404</h1>
  <p>This page drifted out of orbit. The rest of Nexus infOT is still online.</p>
  <a href="./">Back to Nexus infOT</a>
</main>
</body>
</html>
